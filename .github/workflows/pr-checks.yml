name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  patch-check:
    name: Check patch formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace errors
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/${BASE_REF}...HEAD"

  web-data:
    name: Data layer tests and web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Data layer tests
        run: npm test
      - name: Type-check data layer
        run: npm run typecheck:data
      - name: Build web app
        run: npm run build
