name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  patch-check:
    name: Check patch formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace errors
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/${BASE_REF}...HEAD"
